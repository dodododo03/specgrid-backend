# nginx site for SpecGrid (on the EC2 host, not in Docker).
#   sudo cp deploy/nginx/specgrid.conf /etc/nginx/sites-available/specgrid
#   sudo sed -i 's/YOUR_DOMAIN/example.com/g' /etc/nginx/sites-available/specgrid
#   sudo ln -s /etc/nginx/sites-available/specgrid /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN        # adds the HTTPS (443) server + http->https redirect
#
# Before certbot runs this serves plain HTTP; certbot then edits this file to add TLS.

# WebSocket: pass "Upgrade" through only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Up to 10 photos x 10 MB in one upload request (+ form overhead). The app checks each file too.
    client_max_body_size 110m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Uploaded photos: served straight from disk by nginx (the app doesn't serve /media in production).
    # File names are random and never reused, so they can be cached for a long time.
    location /media/ {
        alias /srv/specgrid/data/media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # (add_header here replaces the server-level ones, so repeat nosniff: the app only ever
        #  writes re-encoded .webp files, and the browser must never guess another type)
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }

    # Real-time chat (WebSocket)
    location /api/v1/chat/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;      # idle chats stay connected
        proxy_send_timeout 1h;
    }

    # Everything else: API, Swagger (/docs) and the web frontend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;  # nginx absorbs slow uploads; the app gets the whole body at once
    }
}
